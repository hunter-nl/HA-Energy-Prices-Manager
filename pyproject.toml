[project]
name = "energy-prices-manager"
version = "2.0.3"
description = "Home Assistant App for managing energy prices and dashboard helpers"
readme = "README.md"
requires-python = ">=3.14.2"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi==0.141.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "ruff>=0.16.1",
  "ty>=0.0.65",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "FBT"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
