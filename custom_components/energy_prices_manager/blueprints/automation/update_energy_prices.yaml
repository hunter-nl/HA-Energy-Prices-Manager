blueprint:
   name: Update Energy Prices from Sensor
   description: >-
      Automatically update electricity (T1/T2) and gas input_number helpers
      based on the current active period from Energy Prices Manager sensor.
      Triggers daily at midnight, on Home Assistant start, and when the sensor
      state changes.

input:
   sensor_entity:
      name: Energy Prices Sensor
      selector:
         entity:
            domain: sensor
            integration: energy_prices_manager
            default: sensor.energy_prices_current

   t1_helper:
      name: Low Electricity (T1) Helper
      description: Input number helper for low electricity price
      selector:
         entity:
            domain: input_number
            default: input_number.energy_kwh_low_t1_price
            unit_of_measurement: "EUR/kWh"
            min: 0
            max: 1
            step: 0.00001
            icon: mdi:currency-eur

   t2_helper:
      name: High Electricity (T2) Helper
      description: Input number helper for high electricity price
      selector:
         entity:
            domain: input_number
            default: input_number.energy_kwh_high_t2_price
            unit_of_measurement: "EUR/kWh"
            min: 0
            max: 1
            step: 0.00001
            icon: mdi:currency-eur

   gas_helper:
      name: Gas Price Helper
      description: Input number helper for gas price
      selector:
         entity:
            domain: input_number
            default: input_number.gas_m3_price
            unit_of_measurement: "EUR/m³"
            min: 0
            max: 5
            step: 0.00001
            icon: mdi:currency-eur

mode: restart

trigger:
   - trigger: time
      at: "00:00:01"
   - trigger: homeassistant
      event: start
   - trigger: state
      entity_id: !input sensor_entity

action:
   - choose:
       - conditions:
           - condition: template
              value_template: "{{ trigger.platform != 'state' }}"
        sequence:
           - action: homeassistant.update_entity
              target:
                 entity_id: !input sensor_entity

   - wait_template: |
       {{
        state_attr(!input sensor_entity, 't1') is not none and
        state_attr(!input sensor_entity, 't2') is not none and
        state_attr(!input sensor_entity, 'gas') is not none
       }}
     timeout: "00:00:30"

   - action: input_number.set_value
     target:
       entity_id: !input t2_helper
     data:
       value: "{{ state_attr(!input sensor_entity, 't2') | float }}"

   - action: input_number.set_value
     target:
       entity_id: !input t1_helper
     data:
       value: "{{ state_attr(!input sensor_entity, 't1') | float }}"

   - action: input_number.set_value
     target:
       entity_id: !input gas_helper
     data:
       value: "{{ state_attr(!input sensor_entity, 'gas') | float }}"
