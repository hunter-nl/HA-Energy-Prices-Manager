    <circle cx="128" cy="128" r="78" fill="none" stroke="#76E4DB" stroke-width="12"/>
    <path d="M140 44 78 139h45l-8 73 63-101h-45z" fill="url(#bolt)"/>
    <path d="M63 179h27M166 179h27" fill="none" stroke="#76E4DB" stroke-linecap="round" stroke-width="10"/>
  </g>
  <text x="294" y="132" fill="#F4FBFB" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Energy Prices Manager</text>
  <text x="298" y="188" fill="#76E4DB" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="0.4">Manage electricity and gas tariff periods</text>
