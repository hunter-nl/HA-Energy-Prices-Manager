<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Energy Prices Manager</title>
  <desc id="desc">Energy Prices Manager logo with its energy meter icon</desc>
  <defs>
    <linearGradient id="logo-background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123752"/>
      <stop offset="1" stop-color="#075B69"/>
    </linearGradient>
    <linearGradient id="icon-background" x1="28" y1="28" x2="252" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123752"/>
      <stop offset="1" stop-color="#075B69"/>
    </linearGradient>
    <linearGradient id="bolt" x1="129" y1="84" x2="160" y2="199" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE18A"/>
      <stop offset="1" stop-color="#FFB703"/>
