# GitHub Actions includes the Home Assistant Builder composite actions used by
# the multi-architecture publishing workflow.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      # Group all GitHub Actions updates into a single pull request
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/energy_prices_manager"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
