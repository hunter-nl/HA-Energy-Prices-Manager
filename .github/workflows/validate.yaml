name: Validate

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout Code
        uses: "actions/checkout@v7"
      - name: Validate App configuration
        run: |
          ruby -e 'require "yaml"; YAML.load_file("config.yaml")'
          test -f Dockerfile
          test -f run.sh
