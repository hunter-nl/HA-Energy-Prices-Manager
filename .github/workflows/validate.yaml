name: Validate

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout Code
        uses: "actions/checkout@v7"
      - name: Validate App repository metadata
        run: |
          ruby -e 'require "yaml"; YAML.load_file("repository.yaml"); YAML.load_file("energy_prices_manager/config.yaml")'
          test -f energy_prices_manager/Dockerfile
          test -f energy_prices_manager/run.sh
          test -f energy_prices_manager/icon.png
          test -f energy_prices_manager/logo.png
          test -f energy_prices_manager/CHANGELOG.md
