name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published App version, without prefix v"
        required: true
        type: string
      release_sha:
        description: "Merged release commit SHA to build and tag"
        required: true
        type: string
      release_notes:
        description: "Optional Markdown prepended to the published notes"
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: energy-prices-manager
  REGISTRY_PREFIX: ghcr.io/hunter-nl

jobs:
  release-context:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/'))

    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.result }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Select release commit
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}
        run: echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Read App version
        id: app-version
        uses: mikefarah/yq@v4
        with:
          cmd: yq -r '.version' energy_prices_manager/config.yaml

      - name: Validate merged release commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.app-version.outputs.result }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "GitHub did not provide a full merge commit SHA" >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid App version: $VERSION" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_VERSION" != "$VERSION" ]]; then
            echo "Requested version and App version differ" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$RELEASE_BRANCH" != "release/$VERSION" ]]; then
            echo "Release branch and App version differ" >&2
            exit 1
          fi

          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

  build-images:
    needs: release-context
    name: Initialize image builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Prepare multi-architecture build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build-image:
    needs: [release-context, build-images]
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-images.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}
          persist-credentials: false

      - name: Build and publish ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./energy_prices_manager
          image: ${{ matrix.image }}
          image-tags: ${{ needs.release-context.outputs.version }}
          cache-gha: false
          push: "true"
          version: ${{ needs.release-context.outputs.version }}

  publish-manifest:
    needs: [release-context, build-images, build-image]
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish generic image manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.release-context.outputs.version }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  publish:
    needs: [release-context, publish-manifest]
    runs-on: ubuntu-latest

    # Configure required reviewers for this environment in repository settings.
    environment: release

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Extract custom release notes
        id: custom-release-notes
        uses: actions/github-script@v9
        env:
          MANUAL_RELEASE_NOTES: ${{ inputs.release_notes }}
        with:
          result-encoding: string
          script: |
            if (context.eventName === "workflow_dispatch") {
              return process.env.MANUAL_RELEASE_NOTES.trim();
            }

            const pullRequestBody = context.payload.pull_request.body ?? "";
            const match = pullRequestBody.match(
              /<!-- custom-release-notes:start -->\s*([\s\S]*?)\s*<!-- custom-release-notes:end -->/
            );
            const notes = match?.[1]?.trim();
            return !notes || notes === "_No additional release notes._" ? "" : notes;

      - name: Render release notes
        id: release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          token: ${{ steps.generate-token.outputs.token }}
          # The manually prepared version is authoritative; dry-run renders only.
          dry-run: true
          version: ${{ needs.release-context.outputs.version }}
          tag: v${{ needs.release-context.outputs.version }}
          commitish: ${{ needs.release-context.outputs.release_sha }}

      - name: Assemble release body
        id: release-body
        uses: actions/github-script@v9
        env:
          CUSTOM_RELEASE_NOTES: ${{ steps.custom-release-notes.outputs.result }}
          GENERATED_RELEASE_NOTES: ${{ steps.release-drafter.outputs.body }}
        with:
          result-encoding: string
          script: |
            const customNotes = process.env.CUSTOM_RELEASE_NOTES.trim();
            const generatedNotes = process.env.GENERATED_RELEASE_NOTES.trim();
            return customNotes ? `${customNotes}\n\n${generatedNotes}\n` : `${generatedNotes}\n`;

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          tag_name: v${{ needs.release-context.outputs.version }}
          target_commitish: ${{ needs.release-context.outputs.release_sha }}
          name: ${{ steps.release-drafter.outputs.name }}
          body: ${{ steps.release-body.outputs.result }}
          prerelease: ${{ contains(needs.release-context.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.release-context.outputs.version, '-') }}
