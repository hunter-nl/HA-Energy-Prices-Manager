<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title">Energy Prices Manager</title>

    <!-- Home Assistant fonts/icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page">
      <div class="content">
        <header class="header">
          <div class="header-left">
            <img src="icon.png" alt="Energy Manager" class="header-icon" />
            <div>
              <h1 data-i18n="title">Energy Prices Manager</h1>
              <p class="subtitle" data-i18n="subtitle">
                Configure electricity and gas tariff periods
              </p>
            </div>
          </div>
        </header>

        <section class="ha-card current-card">
          <div class="card-header">
            <h2 data-i18n="current_period">Current active period</h2>
          </div>

          <div id="current-info" class="card-content">
            <div class="empty-state" data-i18n="loading">Loading current period…</div>
          </div>
        </section>

        <section class="ha-card">
          <div class="table-wrapper">
            <table id="periods-table">
              <thead>
                <tr>
                  <th data-i18n="start_date">Start date</th>
                  <th data-i18n="end_date">End date</th>
                  <th data-i18n="import_electricity_t1_price">Electricity import T1 (€)</th>
                  <th data-i18n="import_electricity_t2_price">Electricity import T2 (€)</th>
                  <th data-i18n="export_electricity_t1_price">Electricity export T1 (€)</th>
                  <th data-i18n="export_electricity_t2_price">Electricity export T2 (€)</th>
                  <th data-i18n="gas_price">Gas (€)</th>
                  <th></th>
                </tr>
              </thead>

              <tbody></tbody>
            </table>
          </div>
        </section>

        <div class="actions">
          <button id="add-row" class="ha-button secondary" data-i18n="add_row">➕ Add Row</button>

          <button id="reset-btn" class="ha-button secondary" type="button" data-i18n="reset">
            ↺ Reset
          </button>

          <button id="save-btn" class="ha-button primary" disabled data-i18n="save">
            💾 Save
          </button>
        </div>

        <div id="status-message" class="status-message hidden"></div>
      </div>
    </div>
    <script>
      function applyHATheme() {
        try {
          const parentStyles = getComputedStyle(
            window.parent.document.documentElement,
          );

          const vars = [
            "--primary-background-color",
            "--card-background-color",
            "--primary-text-color",
            "--secondary-text-color",
            "--divider-color",
            "--primary-color",
            "--accent-color",
          ];

          vars.forEach((v) => {
            const value = parentStyles.getPropertyValue(v);

            if (value) {
              document.documentElement.style.setProperty(v, value);
            }
          });
        } catch (e) {
          console.warn("HA theme inheritance failed", e);
        }
      }

      applyHATheme();
    </script>
    <script src="app.js"></script>
  </body>
</html>
